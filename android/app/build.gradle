import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def packageVersion = new JsonSlurper().parse(file("../../package.json")).version as String
def releaseInput = { String name, String fallback = null ->
    if (project.hasProperty(name)) {
        return project.property(name).toString()
    }
    def value = System.getenv(name)
    return value ?: fallback
}
def requestedEnvironment = releaseInput("OTO_ENVIRONMENT")
def supportedEnvironments = ["development", "staging", "production"] as Set
if (requestedEnvironment != null && !supportedEnvironments.contains(requestedEnvironment)) {
    throw new GradleException("Unsupported OTO_ENVIRONMENT: " + requestedEnvironment)
}
def otoBuildNumber = Integer.parseInt(releaseInput("OTO_BUILD_NUMBER", "1"))
def uploadStoreFile = releaseInput("OTO_UPLOAD_STORE_FILE")
def uploadStorePassword = releaseInput("OTO_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = releaseInput("OTO_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = releaseInput("OTO_UPLOAD_KEY_PASSWORD")
def uploadSigningValues = [uploadStoreFile, uploadStorePassword, uploadKeyAlias, uploadKeyPassword]
def hasAnyUploadSigningValue = uploadSigningValues.any { it != null }
def hasCompleteUploadSigning = uploadSigningValues.every { it != null }
if (hasAnyUploadSigningValue && !hasCompleteUploadSigning) {
    throw new GradleException("Android release signing requires all OTO_UPLOAD_* inputs")
}


android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "tz.co.oto"

    defaultConfig {
        applicationId "tz.co.oto"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode otoBuildNumber
        versionName packageVersion
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasCompleteUploadSigning) {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            buildConfigField "String", "OTO_ENVIRONMENT", "\"" + (requestedEnvironment ?: "development") + "\""
        }
        release {
            if (hasCompleteUploadSigning) {
                signingConfig signingConfigs.release
            }
            buildConfigField "String", "OTO_ENVIRONMENT", "\"" + (requestedEnvironment ?: "production") + "\""
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    def media3Version = "1.11.0"

    implementation("com.facebook.react:react-android")
    implementation("androidx.media3:media3-common:${media3Version}")
    implementation("androidx.media3:media3-database:${media3Version}")
    implementation("androidx.media3:media3-datasource:${media3Version}")
    implementation("androidx.media3:media3-exoplayer:${media3Version}")
    implementation("androidx.media3:media3-exoplayer-hls:${media3Version}")
    implementation("androidx.media3:media3-session:${media3Version}")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
