version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # React Native pins its toolchain; these move with RN upgrades, not alone.
    ignore:
      # The RN renderer is built for one exact React version.
      - dependency-name: 'react'
      - dependency-name: 'react-test-renderer'
      # Majors the RN 0.87 template, Babel preset and ESLint config don't support.
      - dependency-name: '@babel/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prettier'
        update-types: ['version-update:semver-major']
      - dependency-name: '@testing-library/react-native'
        update-types: ['version-update:semver-major']
      # Types follow the Node 24 runtime in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      react-native:
        patterns: ['react-native', '@react-native/*', '@react-native-community/cli*']
      dev-tooling:
        dependency-type: development
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Each Gradle release embeds a newer Kotlin; scripts/
      # patch-rn-gradle-plugin-kotlin.js keeps RN's Gradle plugin in step for
      # 9.x. A new major moves with a React Native upgrade.
      - dependency-name: 'gradle-wrapper'
        update-types: ['version-update:semver-major']
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
