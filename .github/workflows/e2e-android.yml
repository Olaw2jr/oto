name: E2E (Android)

# Runs the Maestro smoke flows in .maestro/ on an Android emulator against a
# release build (JS bundled, signed with the debug keystore for testing).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - '.maestro/**'
      - '.github/workflows/e2e-android.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Read by the Maestro installer.
      MAESTRO_VERSION: 2.11.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - name: Build a release APK for testing
        working-directory: android
        env:
          OTO_UPLOAD_STORE_FILE: ${{ github.workspace }}/android/app/debug.keystore
          OTO_UPLOAD_STORE_PASSWORD: android
          OTO_UPLOAD_KEY_ALIAS: androiddebugkey
          OTO_UPLOAD_KEY_PASSWORD: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro --include-tags smoke --format junit --output maestro-report.xml --debug-output maestro-debug
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            maestro-debug
          if-no-files-found: ignore
