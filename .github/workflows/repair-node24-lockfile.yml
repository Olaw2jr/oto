name: Diagnose Node24 lockfile

on:
  push:
    branches: [chore/node24-ci-runtime]
    paths:
      - .github/workflows/repair-node24-lockfile.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and resolve without setup actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          git checkout chore/node24-ci-runtime
          node --version > /tmp/diag.txt 2>&1
          npm --version >> /tmp/diag.txt 2>&1
          rm -f package-lock.json
          set +e
          npm install --package-lock-only --ignore-scripts --strict-peer-deps >> /tmp/diag.txt 2>&1
          STATUS=$?
          echo "exit_status=$STATUS" >> /tmp/diag.txt
          python3 - <<'PY'
import json, os, urllib.request
body = open('/tmp/diag.txt', encoding='utf-8', errors='replace').read()
payload = json.dumps({'body': 'Node24 lockfile diagnostic\n\n~~~text\n' + body[-50000:] + '\n~~~'}).encode()
req = urllib.request.Request(
    'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/issues/18/comments',
    data=payload,
    method='POST',
    headers={
        'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json',
        'X-GitHub-Api-Version': '2022-11-28',
    },
)
with urllib.request.urlopen(req) as response:
    print(response.status)
PY
