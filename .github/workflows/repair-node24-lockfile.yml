name: Repair Node24 lockfile

on:
  push:
    branches: [chore/node24-ci-runtime]
    paths:
      - .github/workflows/repair-node24-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --strict-peer-deps
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): repair npm lockfile after main merge"
          git push
