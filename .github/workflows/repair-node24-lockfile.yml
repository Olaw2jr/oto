name: Diagnose Node24 lockfile

on:
  push:
    branches: [chore/node24-ci-runtime]
    paths:
      - .github/workflows/repair-node24-lockfile.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and resolve without setup actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          git checkout chore/node24-ci-runtime
          node --version > /tmp/diag.txt 2>&1
          npm --version >> /tmp/diag.txt 2>&1
          rm -f package-lock.json
          set +e
          npm install --package-lock-only --ignore-scripts --strict-peer-deps >> /tmp/diag.txt 2>&1
          STATUS=$?
          echo "exit_status=$STATUS" >> /tmp/diag.txt
          COMMENT_BODY="$(python3 -c "import json; s=open('/tmp/diag.txt', encoding='utf-8', errors='replace').read(); print(json.dumps('Node24 lockfile diagnostic\\n\\n~~~text\\n' + s[-50000:] + '\\n~~~'))")"
          curl --fail-with-body -sS -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             "https://api.github.com/repos/${{ github.repository }}/issues/18/comments"             -d "{\"body\":${COMMENT_BODY}}"
