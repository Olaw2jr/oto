name: Repair Node24 lockfile

on:
  push:
    branches: [chore/node24-ci-runtime]
    paths:
      - .github/workflows/repair-node24-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Capture strict npm resolution
        run: |
          set +e
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --strict-peer-deps > lockfile-diagnostic.txt 2>&1
          STATUS=$?
          echo >> lockfile-diagnostic.txt
          echo "exit_status=$STATUS" >> lockfile-diagnostic.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lockfile-diagnostic.txt
          if [ -s package-lock.json ]; then git add package-lock.json; fi
          git commit -m "chore(deps): capture Node 24 lockfile resolution"
          git push
