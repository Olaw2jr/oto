name: Diagnose Node24 gates

on:
  push:
    branches: [chore/node24-ci-runtime]
    paths:
      - .github/workflows/diagnose-node24-gates.yml

jobs:
  checkout-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo checkout-ok

  node-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --version

  npm-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
