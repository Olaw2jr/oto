[project]
name = "oto-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1",
  "alembic>=1.13,<2", "pydantic-settings>=2.4,<3",
  "authlib>=1.3,<2", "httpx>=0.27,<1", "neo4j>=5.24,<7",
  "python-jose[cryptography]>=3.3,<4"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "aiosqlite>=0.20,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
