# Make a shelf, rename it and delete it.
appId: tz.co.oto
tags: [smoke]
---
- runFlow: 01-sign-in.yaml
- tapOn: "You"
- tapOn: "Library"
- tapOn: "New shelf.*"
- inputText: "Road trips"
- tapOn: "Create"
- tapOn: "Road trips.*"
- tapOn: "Shelf options"
- tapOn: "Rename"
- eraseText
- inputText: "Long drives"
- tapOn: "Save"
- assertVisible: "Long drives"
- tapOn: "Shelf options"
- tapOn: "Delete shelf"
- tapOn: "Delete"
- assertNotVisible: "Long drives"
